name: Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download third party sources
        run: ./thirdparty-deploy.sh

      - name: Build release APK (arm64)
        working-directory: android
        env:
          FORK_KEYSTORE_BASE64: ${{ secrets.FORK_KEYSTORE_BASE64 }}
          FORK_KEYSTORE_PASSWORD: ${{ secrets.FORK_KEYSTORE_PASSWORD }}
          FORK_ABIS: arm64-v8a
          FORK_BUILD: ${{ github.run_number }}
        run: |
          if [ -n "$FORK_KEYSTORE_BASE64" ] && [ -n "$FORK_KEYSTORE_PASSWORD" ]; then
            echo "$FORK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fork.p12"
            export FORK_KEYSTORE_FILE="$RUNNER_TEMP/fork.p12"
          else
            echo "::warning::Secrets FORK_KEYSTORE_BASE64 / FORK_KEYSTORE_PASSWORD are not set: building unsigned APK, no release"
          fi
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APK
        id: collect
        run: |
          mkdir -p out
          ls -la android/app/build/outputs/apk/release/
          cp android/app/build/outputs/apk/release/*arm64-v8a*.apk out/CoolReaderPlus.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt" dump badging out/CoolReaderPlus.apk | grep -E "^(package|application-label|sdkVersion|targetSdkVersion|native-code|uses-permission: name='android.permission.MANAGE)"
          if ls android/app/build/outputs/apk/release/*unsigned*.apk >/dev/null 2>&1; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            "$BT/apksigner" verify --print-certs out/CoolReaderPlus.apk | head -3
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: CoolReaderPlus-${{ github.run_number }}
          path: out/CoolReaderPlus.apk

      - name: Publish release
        if: steps.collect.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CoolReader+ build ${{ github.run_number }}
          body: |
            ${{ github.event.head_commit.message }}

            Скачать: CoolReaderPlus.apk ниже.
          files: out/CoolReaderPlus.apk
          make_latest: true

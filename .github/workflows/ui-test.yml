name: UI test

# Emulator walkthrough of UI features; results (screenshots, UI dumps, logs)
# are pushed to branch ui-test-results.
on:
  push:
    branches: [ui-test]

permissions:
  contents: write

concurrency:
  group: ui-test
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download third party sources
        run: ./thirdparty-deploy.sh

      - name: Build debug APK (x86_64 for emulator)
        working-directory: android
        env:
          FORK_ABIS: x86_64
          FORK_BUILD: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI walkthrough
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: python3 ci/ui_test.py ui-out android/app/build/outputs/apk/debug

      - name: Publish results
        if: always()
        run: |
          mkdir -p ui-out
          echo "run ${{ github.run_number }} ${{ job.status }}" > ui-out/STATUS.txt
          cd ui-out
          git init -q
          git checkout -q -b ui-test-results
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "UI test run ${{ github.run_number }} for ${{ github.sha }}" || true
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ui-test-results

apply plugin: 'com.android.application'

android {
    namespace 'org.coolreader'
    compileSdkVersion 35
    buildToolsVersion "35.0.0"
    defaultConfig {
        // fork: own package id, installs next to the original Cool Reader
        applicationId "org.coolreader.fork"
        // fork: 21+ (signing key is ECDSA, needs 18+; the fork targets modern phones)
        minSdkVersion 21
        targetSdkVersion 35
        // When new version released, version code must be incremented at least by 8
        // for compatibility with ABI versioning of split apk (see below).
        // fork: CI passes FORK_BUILD (run number) so every build is an upgrade of the previous one
        def forkBuild = System.getenv("FORK_BUILD")
        versionCode forkBuild != null ? 32570 + 8 * Integer.parseInt(forkBuild) : 32570
        versionName forkBuild != null ? "3.2.59-fork." + forkBuild : "3.2.59-1"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
                cppFlags ""
            }
        }
    }
    sourceSets {
        main {
            setRoot('src/main')
            aidl.srcDirs = ['../../android/src']
            java.srcDirs = ['../../android/src']
            res.srcDirs = ['../../android/res']
        }
    }
    signingConfigs {
        fork {
            // CI passes the keystore via environment; see .github/workflows/android.yml
            def ks = System.getenv("FORK_KEYSTORE_FILE")
            if (ks != null && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv("FORK_KEYSTORE_PASSWORD")
                keyAlias System.getenv("FORK_KEY_ALIAS") ?: "fork"
                keyPassword System.getenv("FORK_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv("FORK_KEYSTORE_FILE") != null)
                signingConfig signingConfigs.fork
            // to make the bug report more readable.
            minifyEnabled false
            shrinkResources false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules-optimize.pro'
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=RelWithDebInfo"
                }
            }
            packagingOptions{
                doNotStrip "**/*.so"
            }
        }
        release_stripped {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules-optimize.pro'
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                }
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
            jniDebuggable true
            debuggable true
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Debug"
                }
            }
            packagingOptions{
                doNotStrip "**/*.so"
            }
        }
    }
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:unchecked"
        }
    }
    // https://developer.android.com/studio/build/configure-apk-splits
    splits {
        abi {
            enable true
            reset()
            // FORK_ABIS env (comma separated) limits ABIs to speed up CI builds
            def forkAbis = System.getenv("FORK_ABIS")
            if (forkAbis != null && !forkAbis.isEmpty()) {
                include(*forkAbis.split(","))
                universalApk false
            } else {
                include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a' //select ABIs to build APKs for
                universalApk true //generate an additional APK that contains all the ABIs
            }
        }
    }
     // map for the version code
    project.ext.abiCodes = [
            'armeabi': 1,
            'armeabi-v7a': 2,
            'arm64-v8a': 6,
            'mips': 3,
            'mips64': 7,
            'x86': 4,
            'x86_64': 5
    ]
    android.applicationVariants.all { variant ->
        variant.outputs.each { output ->
            // Stores the value of ext.abiCodes that is associated with the ABI for this variant.
            def baseAbiVersionCode = project.ext.abiCodes.get(output.getFilter(com.android.build.OutputFile.ABI))
            if (baseAbiVersionCode != null) {
                // Variant 1: small version code increment for various ABI (old behaviour)
                output.versionCodeOverride = variant.versionCode + baseAbiVersionCode
                // Variant 2: big version code increment for various ABI
                //output.versionCodeOverride = variant.versionCode + 1000000*baseAbiVersionCode
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
    lintOptions {
        disable 'MissingTranslation'
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }
    compileOptions {
        // Sets Java compatibility to Java 8
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        aidl true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

task prepareKotlinBuildScriptModel {}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation project(path: ':genrescollection')
}
